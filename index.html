<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8B7EC7">
<title>锦锦的工作台</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工作台">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <!-- 左侧导航 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img class="logo" src="icon-192.png" alt="锦锦">
      <h1>锦锦的工作台</h1>
      <p class="sub">Daily Workbench</p>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <!-- 主内容区 -->
  <main class="main">
    <header class="topbar">
      <div class="time" id="topTime">--:--</div>
      <div class="date" id="topDate">--</div>
    </header>

    <div class="content" id="content"></div>
  </main>
</div>

<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
